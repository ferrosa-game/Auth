opencollection: 1.0.0

info:
  name: Ferrosa Authserver
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Authorization
      value: Bearer {{token}}
  variables:
    - name: base_url
      value: http://127.0.0.1:1841
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
